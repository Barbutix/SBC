name: Veille tournois SBC
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh_local_tournaments.py
      - scripts/local-tournaments-reviewed.json
      - .github/workflows/tournament-scout.yml
concurrency:
  group: tournament-scout
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/scan_tournaments.py
      - name: Relever les tournois à moins de 100 km de Viglain
        run: python scripts/refresh_local_tournaments.py
      - name: Lire les publications de la Page Facebook
        env:
          SBC_FB_PAGE_ID: ${{ vars.SBC_FB_PAGE_ID }}
          SBC_FB_PAGE_ACCESS_TOKEN: ${{ secrets.SBC_FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/scan_facebook_page.py
      - name: Publier la file de validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/event-candidates.json site/local-tournaments.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualiser les tournois locaux et les événements à valider'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
  # Bot commits do not trigger pages.yml: deploy the collected catalog here.
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
