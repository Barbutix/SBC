name: Veille tournois SBC
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh_local_tournaments.py
      - scripts/local-tournaments-reviewed.json
      - scripts/france-regions.geojson
      - .github/workflows/tournament-scout.yml
concurrency:
  group: tournament-scout
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/scan_tournaments.py
      - name: Relever les tournois en France pour tous les rayons
        run: python scripts/refresh_local_tournaments.py
      - name: Lire les publications de la Page Facebook
        env:
          SBC_FB_PAGE_ID: ${{ vars.SBC_FB_PAGE_ID }}
          SBC_FB_PAGE_ACCESS_TOKEN: ${{ secrets.SBC_FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/scan_facebook_page.py
      - name: Publier la file de validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/event-candidates.json site/local-tournaments.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualiser les tournois locaux et les événements à valider'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
  # Bot commits do not trigger pages.yml: deploy the collected catalog here.
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: pages_artifact
        with:
          path: site
      - name: Attendre la disponibilité du site à publier
        uses: actions/github-script@v8
        timeout-minutes: 2
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const expectedId = process.env.PAGES_ARTIFACT_ID;
            if (!expectedId) {
              throw new Error("L’envoi du site n’a pas fourni d’identifiant de fichier.");
            }
            const attempts = 12;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  ...context.repo,
                  run_id: context.runId,
                  name: 'github-pages',
                  per_page: 100,
                  headers: { 'cache-control': 'no-cache' }
                });
                const artifact = data.artifacts.find(item =>
                  item.name === 'github-pages' &&
                  String(item.id) === expectedId && !item.expired
                );
                if (artifact) {
                  // Pages uses a separate artifact service: allow it to catch up too.
                  await new Promise(resolve => setTimeout(resolve, 5000));
                  core.info(`Site disponible pour publication (fichier ${expectedId}).`);
                  return;
                }
              } catch (error) {
                if (![429, 500, 502, 503, 504].includes(error.status)) throw error;
                core.warning(`Service de fichiers temporairement indisponible (${error.status}).`);
              }
              if (attempt < attempts) {
                core.info(`Attente du fichier à publier (${attempt}/${attempts})…`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            throw new Error("Le fichier du site reste introuvable après plusieurs vérifications. Relancer la publication GitHub Pages.");
      - uses: actions/deploy-pages@v4
        id: deployment
