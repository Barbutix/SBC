name: Veille tournois SBC
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/scan_tournaments.py
      - name: Lire les publications de la Page Facebook
        env:
          SBC_FB_PAGE_ID: ${{ vars.SBC_FB_PAGE_ID }}
          SBC_FB_PAGE_ACCESS_TOKEN: ${{ secrets.SBC_FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/scan_facebook_page.py
      - name: Publier la file de validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/event-candidates.json
          git diff --cached --quiet || (git commit -m 'Mettre à jour les événements à valider' && git push)
